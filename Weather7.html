<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Hong Kong Weather Clock</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    width:100vw;
    height:100vh;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:
        "Segoe UI",
        "Microsoft JhengHei",
        sans-serif;

    transition:background 0.8s ease, color 0.8s ease;
}


/* ===================================
   Theme
=================================== */

.normal{
    background:#16213e;
    color:white;
}

.yellowrain{
    background:#FFD600;
    color:black;
}

.redrain{
    background:#B71C1C;
    color:white;
}

.blackrain{
    background:#000000;
    color:white;
}

.thunderstorm{
    background:#39215A;
    color:white;
}

.typhoon{
    background:#0D47A1;
    color:white;
}

.hot{
    background:#7B1900;
    color:white;
    animation: hotPulse 3s ease-in-out infinite;
}

.cold{
    background:#0a1a3a;
    color:white;
}

/* HOT 背景脈衝 */
@keyframes hotPulse {
    0%   { background:#7B1900; }
    50%  { background:#BF360C; }
    100% { background:#7B1900; }
}

/* 多重天氣背景漸層 */
.redrain-thunder{
    background: linear-gradient(135deg, #B71C1C 50%, #39215A 50%);
    color:white;
}

.blackrain-thunder{
    background: linear-gradient(135deg, #000000 50%, #39215A 50%);
    color:white;
}

.yellowrain-thunder{
    background: linear-gradient(135deg, #FFD600 50%, #39215A 50%);
    color:black;
}


/* ===================================
   Main Layout
=================================== */

.container{

    width:90%;
    max-width:1800px;

    display:flex;

    justify-content:space-between;
    align-items:center;

    position:relative;

    z-index:100;
}


/* ===================================
   Left Panel
=================================== */

.left-panel{

    width:45%;
}

.clock{

    font-size:14rem;

    font-weight:700;

    line-height:1;

    letter-spacing:6px;
}

.date{

    margin-top:25px;

    font-size:2rem;

    opacity:0.85;
}


/* ===================================
   Right Panel
=================================== */

.right-panel{

    width:45%;

    display:flex;

    flex-direction:column;

    align-items:center;

    text-align:center;
}

.icon-container{

    position:relative;

    width:240px;

    height:240px;

    display:flex;

    align-items:center;

    justify-content:center;

    margin-bottom:20px;
}

/* 標準天氣圖示 */
.icon{

    width:180px;

    height:180px;

    object-fit:contain;

    z-index:10;
}

/* ===================================
   Typhoon Vortex Icon (New)
   風球漩渦圖示 - 代號在中央
=================================== */

#vortexIconContainer {
    position: absolute;
    width: 220px;
    height: 220px;
    display: none; /* 預設隱藏 */
    align-items: center;
    justify-content: center;
    z-index: 20;
}

.vortex-svg {
    position: absolute;
    width: 100%;
    height: 100%;
    animation: vortexRotate 3s linear infinite;
}

.vortex-svg.t10 {
    animation-duration: 1.5s; /* T10 轉更快 */
}

@keyframes vortexRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.vortex-number {
    position: relative;
    font-size: 4rem;
    font-weight: 900;
    color: white;
    text-shadow: 0 0 15px rgba(0,0,0,0.5);
    z-index: 21;
}

.vortex-number.double-digit {
    font-size: 3rem; /* 10 號縮小字體 */
}


/* ===================================
   Lightning Layer (Enhanced)
=================================== */

#lightning{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:white;

    opacity:0;

    pointer-events:none;

    z-index:9999;
}

#lightning-secondary{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(255,255,255,0.6);

    opacity:0;

    pointer-events:none;

    z-index:9998;
}


/* ===================================
   Rain / Snow / Heat / Wind Layers
=================================== */

#rain-layer, #snow-layer, #heat-layer, #wind-layer, #vortex-bg-layer {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
    z-index:1;
}

.raindrop{
    position:absolute;
    width:2px;
    height:25px;
    background:rgba(255,255,255,0.5);
    animation:fall linear infinite;
}

@keyframes fall{
    from{ transform:translateY(-100px); }
    to{ transform:translateY(110vh); }
}

.snowflake{
    position:absolute;
    color:rgba(200,230,255,0.85);
    font-size:1.2rem;
    animation:snowFall linear infinite;
}

@keyframes snowFall{
    0%{ transform:translateY(-40px) rotate(0deg); opacity:1; }
    100%{ transform:translateY(110vh) rotate(360deg); opacity:0.3; }
}

.heatwave{
    position:absolute;
    width:200px;
    height:200px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,100,0,0.18) 0%, transparent 70%);
    animation:heatRise linear infinite;
}

@keyframes heatRise{
    0%{ transform:translateY(110vh) scale(0.5); opacity:0; }
    30%{ opacity:1; }
    100%{ transform:translateY(-20vh) scale(1.5); opacity:0; }
}

.wind-streak{
    position:absolute;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation:windBlow linear infinite;
}

@keyframes windBlow{
    0%{ transform:translateX(-100vw) skewX(-20deg); opacity:0; }
    100%{ transform:translateX(100vw) skewX(-20deg); opacity:0; }
}

.wind-layer-t8 .wind-streak{ height:3px; }
.wind-layer-t10 .wind-streak{ height:5px; }

/* 背景大氣旋 */
#vortex-bg-layer {
    top:50%; left:50%;
    width:800px; height:800px;
    margin-left:-400px; margin-top:-400px;
}

.vortex-bg{
    width:100%; height:100%;
    border-radius:50%;
    background:conic-gradient(from 0deg, rgba(255,255,255,0.08) 0deg, transparent 45deg, rgba(255,255,255,0.08) 90deg, transparent 135deg, rgba(255,255,255,0.08) 180deg, transparent 225deg, rgba(255,255,255,0.08) 270deg, transparent 315deg, rgba(255,255,255,0.08) 360deg);
    animation:vortexSpin linear infinite;
}

@keyframes vortexSpin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
}

body.t10-shake{ animation:screenShake 0.1s infinite; }
@keyframes screenShake{
    0%, 100%{ transform:translateX(0); }
    25%{ transform:translateX(-2px); }
    75%{ transform:translateX(2px); }
}


/* ===================================
   Control Panel
=================================== */

#toggleBtn{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.55); backdrop-filter:blur(8px);
    border:none; border-radius:20px; color:white; font-size:1.1rem; font-weight:700;
    padding:8px 18px; cursor:pointer; z-index:100001; letter-spacing:2px;
}

#controlPanel{
    position:fixed; bottom:60px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,0.70); backdrop-filter:blur(10px);
    border-radius:14px; padding:14px 16px; z-index:100000;
    display:none; min-width:360px; max-height:80vh; overflow-y:auto;
}

#controlPanel.visible{ display:block; }

.button-row{ display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-bottom:10px; }

#controlPanel button{
    border:none; border-radius:8px; cursor:pointer; padding:8px 14px;
    font-weight:600; font-size:0.9rem; background:#e0e0e0; color:#111;
}

#controlPanel button.active{ background:#4CAF50; color:white; }

.panel-divider{ border:none; border-top:1px solid rgba(255,255,255,0.2); margin:8px 0; }

.panel-label{ color:rgba(255,255,255,0.6); font-size:0.75rem; text-align:center; margin-bottom:6px; }


/* ===================================
   Mobile
=================================== */

@media(max-width:768px){
    .container{ flex-direction:column; }
    .left-panel{ width:100%; text-align:center; margin-bottom:30px; }
    .right-panel{ width:100%; }
    .clock{ font-size:6rem; }
    .date{ font-size:1.2rem; }
    .message{ font-size:1.5rem; }
    .icon-container{ width:180px; height:180px; }
    .icon{ width:140px; height:140px; }
    #vortexIconContainer { width: 160px; height: 160px; }
    .vortex-number { font-size: 3rem; }
    .vortex-number.double-digit { font-size: 2.2rem; }
}

</style>

</head>

<body class="normal">

<div id="lightning"></div>
<div id="lightning-secondary"></div>

<div id="rain-layer"></div>
<div id="snow-layer"></div>
<div id="heat-layer"></div>
<div id="wind-layer"></div>
<div id="vortex-bg-layer"></div>

<div class="container">

    <div class="left-panel">
        <div id="clock" class="clock">--:--</div>
        <div id="date" class="date">----/--/--</div>
    </div>

    <div class="right-panel">
        <div class="icon-container">
            <!-- 標準圖示 -->
            <img id="weatherIcon" class="icon" src="" alt="Weather Icon">
            
            <!-- 風球漩渦圖示 (中心顯示代號) -->
            <div id="vortexIconContainer">
                <svg class="vortex-svg" viewBox="0 0 100 100">
                    <defs>
                        <linearGradient id="vortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:rgba(255,255,255,0.8);stop-opacity:1" />
                            <stop offset="100%" style="stop-color:rgba(255,255,255,0.1);stop-opacity:0" />
                        </linearGradient>
                    </defs>
                    <!-- 漩渦線條 -->
                    <path d="M50 10 A40 40 0 0 1 90 50 A40 40 0 0 1 50 90 A40 40 0 0 1 10 50 A40 40 0 0 1 50 10" fill="none" stroke="url(#vortexGrad)" stroke-width="4" stroke-dasharray="20 10" />
                    <path d="M50 20 A30 30 0 0 1 80 50 A30 30 0 0 1 50 80 A30 30 0 0 1 20 50 A30 30 0 0 1 50 20" fill="none" stroke="url(#vortexGrad)" stroke-width="6" stroke-dasharray="15 5" />
                    <path d="M50 30 A20 20 0 0 1 70 50 A20 20 0 0 1 50 70 A20 20 0 0 1 30 50 A20 20 0 0 1 50 30" fill="none" stroke="url(#vortexGrad)" stroke-width="8" />
                </svg>
                <div id="vortexNumber" class="vortex-number"></div>
            </div>
        </div>

        <div id="message" class="message">Loading...</div>
        <div id="detail" class="detail"></div>
    </div>

</div>

<button id="toggleBtn" onclick="togglePanel()">...</button>

<div id="controlPanel">
    <div class="panel-label">語言 / Language</div>
    <div class="button-row">
        <button onclick="setLanguage('tc')">中文</button>
        <button onclick="setLanguage('en')">English</button>
    </div>
    <hr class="panel-divider">
    <div class="panel-label">模式 / Mode</div>
    <div class="button-row">
        <button class="btn-normal" onclick="setNormalMode()">Normal</button>
    </div>
    <hr class="panel-divider">
    <div class="panel-label">颱風信號 / Typhoon Signal (單選)</div>
    <div class="button-row">
        <button id="btn-t1" onclick="selectTyphoon('T1')">T1</button>
        <button id="btn-t3" onclick="selectTyphoon('T3')">T3</button>
        <button id="btn-t8" onclick="selectTyphoon('T8')">T8</button>
        <button id="btn-t10" onclick="selectTyphoon('T10')">T10</button>
    </div>
    <hr class="panel-divider">
    <div class="panel-label">暴雨警告 / Rainstorm (單選)</div>
    <div class="button-row">
        <button id="btn-amber" onclick="selectRainstorm('AMBER')">Amber</button>
        <button id="btn-red" onclick="selectRainstorm('RED')">Red</button>
        <button id="btn-black" onclick="selectRainstorm('BLACK')">Black</button>
    </div>
    <hr class="panel-divider">
    <div class="panel-label">特殊天氣 / Special (多選)</div>
    <div class="button-row">
        <button id="btn-thunder" onclick="toggleSpecial('THUNDER')">Thunderstorm</button>
        <button id="btn-hot" onclick="toggleSpecial('HOT')">Hot</button>
        <button id="btn-cold" onclick="toggleSpecial('COLD')">Cold</button>
    </div>
</div>

<script>

let language = "tc";
let isSimulationMode = false;
let temperature = "--";
let humidity = "--";
let warningText = "";
let specialWeatherMessage = "";
let currentWeatherIcon = "";
let currentTheme = "normal";
let currentTyphoonSignal = null;

let selectedTyphoon = null;
let selectedRainstorm = null;
let selectedSpecials = { THUNDER: false, HOT: false, COLD: false };
let lightningInterval = null;

/* 面板切換 */
let panelHideTimer = null;
function togglePanel() {
    const p = document.getElementById("controlPanel");
    if (p.classList.contains("visible")) hidePanel(); else showPanel();
}
function showPanel() {
    document.getElementById("controlPanel").classList.add("visible");
    resetHideTimer();
}
function hidePanel() {
    document.getElementById("controlPanel").classList.remove("visible");
    clearTimeout(panelHideTimer);
}
function resetHideTimer() {
    clearTimeout(panelHideTimer);
    panelHideTimer = setTimeout(hidePanel, 5000);
}
document.getElementById("controlPanel").addEventListener("mousemove", resetHideTimer);
document.getElementById("controlPanel").addEventListener("touchstart", resetHideTimer);

/* 時鐘 */
function updateClock() {
    const now = new Date();
    const timeString = now.toLocaleTimeString(language === "en" ? "en-GB" : "zh-HK", { hour: "2-digit", minute: "2-digit" });
    const dateString = language === "en" ? now.toLocaleDateString("en-HK", { year: "numeric", month: "short", day: "numeric" }) : now.toLocaleDateString("zh-HK");
    document.getElementById("clock").innerHTML = timeString;
    document.getElementById("date").innerHTML = dateString;
}

/* 主題 */
function applyTheme(theme) {
    document.body.className = theme;
    if (theme === "typhoon" && currentTyphoonSignal === "T10") document.body.classList.add("t10-shake");
}

/* 特效層清除 */
function clearAllEffects() {
    document.getElementById("rain-layer").innerHTML = "";
    document.getElementById("snow-layer").innerHTML = "";
    document.getElementById("heat-layer").innerHTML = "";
    document.getElementById("wind-layer").innerHTML = "";
    document.getElementById("vortex-bg-layer").innerHTML = "";
    document.getElementById("wind-layer").className = "";
}

/* 雨滴 */
function createRain() {
    const l = document.getElementById("rain-layer");
    for (let i = 0; i < 120; i++) {
        const d = document.createElement("div");
        d.className = "raindrop";
        d.style.left = Math.random() * 100 + "vw";
        d.style.animationDuration = (0.4 + Math.random()) + "s";
        d.style.animationDelay = Math.random() * 2 + "s";
        l.appendChild(d);
    }
}

/* 雪花 */
function createSnow() {
    const l = document.getElementById("snow-layer");
    const chars = ["❄", "❅", "❆"];
    for (let i = 0; i < 60; i++) {
        const f = document.createElement("div");
        f.className = "snowflake";
        f.textContent = chars[Math.floor(Math.random() * chars.length)];
        f.style.left = Math.random() * 100 + "vw";
        f.style.fontSize = (0.7 + Math.random() * 1.5) + "rem";
        f.style.animationDuration = (4 + Math.random() * 6) + "s";
        l.appendChild(f);
    }
}

/* 熱浪 */
function createHeat() {
    const l = document.getElementById("heat-layer");
    for (let i = 0; i < 12; i++) {
        const w = document.createElement("div");
        w.className = "heatwave";
        w.style.left = (Math.random() * 110 - 5) + "vw";
        w.style.width = (100 + Math.random() * 200) + "px";
        w.style.height = w.style.width;
        w.style.animationDuration = (5 + Math.random() * 6) + "s";
        l.appendChild(w);
    }
}

/* 風跡與背景氣旋 */
function createWindAndVortex(intensity) {
    const wl = document.getElementById("wind-layer");
    const vbl = document.getElementById("vortex-bg-layer");
    wl.classList.add(intensity === "T10" ? "wind-layer-t10" : "wind-layer-t8");
    const count = intensity === "T10" ? 25 : 15;
    for (let i = 0; i < count; i++) {
        const s = document.createElement("div");
        s.className = "wind-streak";
        s.style.top = Math.random() * 100 + "vh";
        s.style.width = (200 + Math.random() * 400) + "px";
        s.style.animationDuration = (intensity === "T10" ? 2 : 4) + Math.random() * 3 + "s";
        wl.appendChild(s);
    }
    const v = document.createElement("div");
    v.className = "vortex-bg";
    v.style.animationDuration = intensity === "T10" ? "5s" : "8s";
    vbl.appendChild(v);
}

/* 強化閃電 */
function triggerLightning() {
    const f1 = document.getElementById("lightning");
    const f2 = document.getElementById("lightning-secondary");
    f1.style.opacity = "0.9";
    setTimeout(() => { f1.style.opacity = "0"; }, 80);
    setTimeout(() => {
        f2.style.opacity = "0.7";
        setTimeout(() => { f2.style.opacity = "0"; }, 60);
    }, 120);
}

function startLightning() {
    if (lightningInterval) clearInterval(lightningInterval);
    lightningInterval = setInterval(() => {
        if (selectedSpecials.THUNDER || warningText.includes("雷暴")) triggerLightning();
    }, 4000 + Math.random() * 3000);
}

/* 警告處理 */
function classifyWarnings(warnings) {
    const res = { hasBlack: false, hasRed: false, hasAmber: false, hasThunder: false, hasTyphoon: false, hasHot: false, hasCold: false, typhoonSignal: null };
    for (const w of warnings) {
        const l = w.toLowerCase();
        if (l.includes("black") || w.includes("黑")) res.hasBlack = true;
        if (l.includes("red") || w.includes("紅")) res.hasRed = true;
        if (l.includes("amber") || w.includes("黃")) res.hasAmber = true;
        if (l.includes("thunder") || w.includes("雷暴")) res.hasThunder = true;
        if (l.includes("signal") || w.includes("風球") || w.includes("信號")) {
            res.hasTyphoon = true;
            if (w.includes("10")) res.typhoonSignal = "T10";
            else if (w.includes("8")) res.typhoonSignal = "T8";
            else if (w.includes("3")) res.typhoonSignal = "T3";
            else res.typhoonSignal = "T1";
        }
        if (l.includes("hot") || w.includes("酷熱")) res.hasHot = true;
        if (l.includes("cold") || w.includes("寒冷")) res.hasCold = true;
    }
    return res;
}

function processWarnings(warnings) {
    const stdIcon = document.getElementById("weatherIcon");
    const vIconCont = document.getElementById("vortexIconContainer");
    const vNum = document.getElementById("vortexNumber");
    const vSvg = vIconCont.querySelector(".vortex-svg");

    clearAllEffects();
    warningText = warnings.join(" / ");
    
    if (warnings.length === 0) {
        applyTheme("normal");
        stdIcon.style.display = "block";
        vIconCont.style.display = "none";
        if (lightningInterval) clearInterval(lightningInterval);
        return;
    }

    const flags = classifyWarnings(warnings);
    currentTyphoonSignal = flags.typhoonSignal;

    if (flags.hasBlack || flags.hasRed || flags.hasAmber) createRain();
    if (flags.hasHot) createHeat();
    if (flags.hasCold) createSnow();
    if (flags.hasThunder) startLightning();

    if (flags.hasTyphoon) {
        stdIcon.style.display = "none";
        vIconCont.style.display = "flex";
        const num = flags.typhoonSignal.replace("T", "");
        vNum.textContent = num;
        vNum.className = "vortex-number" + (num === "10" ? " double-digit" : "");
        vSvg.className = "vortex-svg" + (num === "10" ? " t10" : "");
        createWindAndVortex(flags.typhoonSignal);
    } else {
        stdIcon.style.display = "block";
        vIconCont.style.display = "none";
    }

    /* 主題優先級 */
    if (flags.hasBlack) applyTheme(flags.hasThunder ? "blackrain-thunder" : "blackrain");
    else if (flags.hasRed) applyTheme(flags.hasThunder ? "redrain-thunder" : "redrain");
    else if (flags.hasAmber) applyTheme(flags.hasThunder ? "yellowrain-thunder" : "yellowrain");
    else if (flags.hasThunder) applyTheme("thunderstorm");
    else if (flags.hasTyphoon) applyTheme("typhoon");
    else if (flags.hasHot) applyTheme("hot");
    else if (flags.hasCold) applyTheme("cold");
    else applyTheme("normal");
}

/* 模擬控制 */
function selectTyphoon(s) { selectedTyphoon = (selectedTyphoon === s ? null : s); updateSim(); }
function selectRainstorm(r) { selectedRainstorm = (selectedRainstorm === r ? null : r); updateSim(); }
function toggleSpecial(k) { selectedSpecials[k] = !selectedSpecials[k]; updateSim(); }
function updateSim() {
    isSimulationMode = true;
    const ws = [];
    if (selectedTyphoon) ws.push(language === "en" ? `Signal No.${selectedTyphoon.slice(1)}` : `${selectedTyphoon.slice(1)}號風球`);
    if (selectedRainstorm) ws.push(language === "en" ? `${selectedRainstorm} Rainstorm` : `${selectedRainstorm === "AMBER" ? "黃" : selectedRainstorm === "RED" ? "紅" : "黑"}色暴雨警告`);
    if (selectedSpecials.THUNDER) ws.push(language === "en" ? "Thunderstorm Warning" : "雷暴警告");
    if (selectedSpecials.HOT) ws.push(language === "en" ? "Hot Weather Warning" : "酷熱天氣警告");
    if (selectedSpecials.COLD) ws.push(language === "en" ? "Cold Weather Warning" : "寒冷天氣警告");
    
    document.getElementById("btn-t1").className = selectedTyphoon === "T1" ? "active" : "";
    document.getElementById("btn-t3").className = selectedTyphoon === "T3" ? "active" : "";
    document.getElementById("btn-t8").className = selectedTyphoon === "T8" ? "active" : "";
    document.getElementById("btn-t10").className = selectedTyphoon === "T10" ? "active" : "";
    document.getElementById("btn-amber").className = selectedRainstorm === "AMBER" ? "active" : "";
    document.getElementById("btn-red").className = selectedRainstorm === "RED" ? "active" : "";
    document.getElementById("btn-black").className = selectedRainstorm === "BLACK" ? "active" : "";
    document.getElementById("btn-thunder").className = selectedSpecials.THUNDER ? "active" : "";
    document.getElementById("btn-hot").className = selectedSpecials.HOT ? "active" : "";
    document.getElementById("btn-cold").className = selectedSpecials.COLD ? "active" : "";

    processWarnings(ws);
    updateDisplay();
}

function updateDisplay() {
    document.getElementById("weatherIcon").src = currentWeatherIcon;
    const m = document.getElementById("message");
    const d = document.getElementById("detail");
    if (warningText) {
        m.className = "message warning-text";
        m.innerHTML = warningText;
        d.innerHTML = language === "en" ? "Warning In Force" : "警告生效中";
    } else {
        m.className = "message";
        m.innerHTML = `${temperature}°C`;
        d.innerHTML = language === "en" ? `Humidity ${humidity}%` : `相對濕度 ${humidity}%`;
    }
}

function setLanguage(l) { language = l; updateClock(); if (isSimulationMode) updateSim(); else loadWeather(); }
function setNormalMode() { isSimulationMode = false; selectedTyphoon = null; selectedRainstorm = null; selectedSpecials = { THUNDER: false, HOT: false, COLD: false }; updateSim(); loadWeather(); }

async function loadWeather() {
    if (isSimulationMode) return;
    try {
        const r = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=${language}`);
        const data = await r.json();
        temperature = data.temperature.data[1].value;
        humidity = data.humidity.data[0].value;
        currentWeatherIcon = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${data.icon[0]}.png`;
        
        const wr = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=${language}`);
        const wdata = await wr.json();
        const ws = [];
        for (const k in wdata) if (wdata[k].actionCode === "ISSUE") ws.push(wdata[k].name);
        processWarnings(ws);
        updateDisplay();
    } catch(e) { console.error(e); }
}

updateClock();
loadWeather();
setInterval(updateClock, 1000);
setInterval(loadWeather, 300000);

</script>
