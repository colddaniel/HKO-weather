<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hong Kong Weather Clock</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    font-family:"Segoe UI", "Microsoft JhengHei", sans-serif;
    transition:background 0.8s ease, color 0.8s ease;
}

/* ===== 主容器 ===== */
.main-container{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    z-index:100;
    overflow:hidden;
}

/* ===== 時間與天氣佈局 ===== */
.content-wrapper{
    width:95%;
    max-width:1800px;
    height:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.left-panel{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.clock{
    /* 混合式字體大小：預設自動，可被手動覆蓋 */
    font-size:clamp(3rem, 15vw, 14rem);
    font-weight:700;
    line-height:1;
    letter-spacing:6px;
    transition:font-size 0.3s ease;
}

.clock.size-small{ font-size:6rem !important; }
.clock.size-medium{ font-size:10rem !important; }
.clock.size-large{ font-size:14rem !important; }

.date{
    margin-top:20px;
    font-size:clamp(1rem, 3vw, 2rem);
    opacity:0.85;
    transition:font-size 0.3s ease;
}

.right-panel{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    min-width:200px;
}

.icon-container{
    position:relative;
    width:clamp(120px, 25vw, 240px);
    height:clamp(120px, 25vw, 240px);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:20px;
}

.icon{
    width:100%;
    height:100%;
    object-fit:contain;
}

#vortexIconContainer{
    position:absolute;
    width:100%;
    height:100%;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:20;
}

.vortex-svg{
    width:100%;
    height:100%;
    animation:vortexRotate 3s linear infinite;
}

.vortex-svg.t10{ animation-duration:1.5s; }

@keyframes vortexRotate{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
}

.vortex-number{
    position:absolute;
    font-size:clamp(2rem, 8vw, 4rem);
    font-weight:900;
    color:white;
    text-shadow:0 0 15px rgba(0,0,0,0.5);
    z-index:21;
}

.vortex-number.double-digit{ font-size:clamp(1.5rem, 6vw, 3rem); }

.message{
    font-size:clamp(1.2rem, 4vw, 2.2rem);
    font-weight:700;
    margin-bottom:15px;
    transition:font-size 0.3s ease;
}

.detail{
    width:100%;
    max-width:600px;
    font-size:clamp(0.9rem, 2vw, 1.2rem);
    line-height:1.8;
    word-wrap:break-word;
    transition:font-size 0.3s ease;
}

/* ===== 主題 ===== */
.normal{ background:#16213e; color:white; }
.yellowrain{ background:#FFD600; color:black; }
.redrain{ background:#B71C1C; color:white; }
.blackrain{ background:#000000; color:white; }
.thunderstorm{ background:#39215A; color:white; }
.typhoon{ background:#0D47A1; color:white; }
.hot{ background:#7B1900; color:white; animation:hotPulse 3s ease-in-out infinite; }
.cold{ background:#0a1a3a; color:white; }

@keyframes hotPulse{
    0%{ background:#7B1900; }
    50%{ background:#BF360C; }
    100%{ background:#7B1900; }
}

.redrain-thunder{ background:linear-gradient(135deg, #B71C1C 50%, #39215A 50%); color:white; }
.blackrain-thunder{ background:linear-gradient(135deg, #000000 50%, #39215A 50%); color:white; }
.yellowrain-thunder{ background:linear-gradient(135deg, #FFD600 50%, #39215A 50%); color:black; }

/* ===== 特效層 ===== */
#lightning, #lightning-secondary, #rain-layer, #snow-layer, #heat-layer, #wind-layer, #vortex-bg-layer{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
    z-index:1;
}

#lightning, #lightning-secondary{ background:white; opacity:0; z-index:9999; }
#lightning-secondary{ background:rgba(255,255,255,0.6); z-index:9998; }

/* SVG 閃電 */
#lightning-svg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:9997;
}

.raindrop{
    position:absolute;
    width:2px;
    height:25px;
    background:rgba(255,255,255,0.5);
    animation:fall linear infinite;
}

@keyframes fall{
    from{ transform:translateY(-100px); }
    to{ transform:translateY(110vh); }
}

.snowflake{
    position:absolute;
    color:rgba(200,230,255,0.85);
    font-size:1.2rem;
    animation:snowFall linear infinite;
}

@keyframes snowFall{
    0%{ transform:translateY(-40px) rotate(0deg); opacity:1; }
    100%{ transform:translateY(110vh) rotate(360deg); opacity:0.3; }
}

.heatwave{
    position:absolute;
    width:200px;
    height:200px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,100,0,0.18) 0%, transparent 70%);
    animation:heatRise linear infinite;
}

@keyframes heatRise{
    0%{ transform:translateY(110vh) scale(0.5); opacity:0; }
    30%{ opacity:1; }
    100%{ transform:translateY(-20vh) scale(1.5); opacity:0; }
}

.wind-streak{
    position:absolute;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation:windBlow linear infinite;
}

@keyframes windBlow{
    0%{ transform:translateX(-100vw) skewX(-20deg); opacity:0; }
    100%{ transform:translateX(100vw) skewX(-20deg); opacity:0; }
}

.wind-layer-t8 .wind-streak{ height:3px; }
.wind-layer-t10 .wind-streak{ height:5px; }

.vortex-bg{
    width:100%;
    height:100%;
    border-radius:50%;
    background:conic-gradient(from 0deg, rgba(255,255,255,0.08) 0deg, transparent 45deg, rgba(255,255,255,0.08) 90deg, transparent 135deg, rgba(255,255,255,0.08) 180deg, transparent 225deg, rgba(255,255,255,0.08) 270deg, transparent 315deg, rgba(255,255,255,0.08) 360deg);
    animation:vortexSpin linear infinite;
}

@keyframes vortexSpin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
}

body.t10-shake{ animation:screenShake 0.1s infinite; }
@keyframes screenShake{
    0%, 100%{ transform:translateX(0); }
    25%{ transform:translateX(-2px); }
    75%{ transform:translateX(2px); }
}

/* ===== SWT 訊息區 ===== */
.swt-section{
    background:rgba(0,0,0,0.3);
    backdrop-filter:blur(8px);
    border-top:1px solid rgba(255,255,255,0.2);
    padding:12px 20px;
    max-height:120px;
    overflow-y:auto;
    z-index:50;
}

.swt-label{
    font-size:0.8rem;
    opacity:0.7;
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:1px;
}

#swtContent{
    font-size:0.95rem;
    line-height:1.6;
    opacity:0.9;
}

/* ===== 控制面板 ===== */
#toggleBtn{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(8px);
    border:none;
    border-radius:20px;
    color:white;
    font-size:1.1rem;
    font-weight:700;
    padding:8px 18px;
    cursor:pointer;
    z-index:100001;
    letter-spacing:2px;
}

#controlPanel{
    position:fixed;
    bottom:60px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(10px);
    border-radius:14px;
    padding:14px 16px;
    z-index:100000;
    display:none;
    min-width:300px;
    max-width:90vw;
    max-height:70vh;
    overflow-y:auto;
}

#controlPanel.visible{ display:block; }

.button-row{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:10px;
}

#controlPanel button{
    border:none;
    border-radius:8px;
    cursor:pointer;
    padding:8px 12px;
    font-weight:600;
    font-size:0.85rem;
    background:#e0e0e0;
    color:#111;
    transition:background 0.2s;
}

#controlPanel button.active{
    background:#4CAF50;
    color:white;
}

.panel-divider{
    border:none;
    border-top:1px solid rgba(255,255,255,0.2);
    margin:8px 0;
}

.panel-label{
    color:rgba(255,255,255,0.6);
    font-size:0.75rem;
    text-align:center;
    margin-bottom:6px;
    letter-spacing:1px;
    text-transform:uppercase;
}

/* 字體大小按鈕 */
.size-btn{
    padding:6px 10px;
    font-size:0.8rem;
}

.size-btn.active{
    background:#FF9800;
    color:white;
}

/* Input Box */
.input-section{
    margin-top:10px;
    padding:10px;
    background:rgba(255,255,255,0.05);
    border-radius:8px;
}

.input-section label{
    display:block;
    font-size:0.75rem;
    color:rgba(255,255,255,0.7);
    margin-bottom:5px;
}

.input-section input{
    width:100%;
    padding:8px;
    border:1px solid rgba(255,255,255,0.3);
    border-radius:4px;
    background:rgba(255,255,255,0.1);
    color:white;
    font-size:0.9rem;
}

.input-section input::placeholder{
    color:rgba(255,255,255,0.4);
}

.input-section button{
    width:100%;
    margin-top:8px;
    padding:8px;
    background:#2196F3;
    color:white;
    border:none;
    border-radius:4px;
    cursor:pointer;
    font-weight:600;
}

/* ===== 模擬模式指示 ===== */
.mode-indicator{
    position:fixed;
    top:10px;
    right:10px;
    background:rgba(0,0,0,0.6);
    color:white;
    padding:6px 12px;
    border-radius:20px;
    font-size:0.8rem;
    z-index:100;
}

.mode-indicator.simulation{
    background:rgba(255, 152, 0, 0.8);
}

/* ===== Mobile ===== */
@media(max-width:768px){
    .content-wrapper{
        flex-direction:column;
        justify-content:center;
        gap:15px;
    }
    
    .left-panel{
        width:100%;
        text-align:center;
    }
    
    .right-panel{
        width:100%;
    }
    
    .icon-container{
        width:clamp(100px, 20vw, 180px);
        height:clamp(100px, 20vw, 180px);
    }
    
    #controlPanel{
        min-width:85vw;
        max-width:95vw;
    }
}

</style>

</head>

<body class="normal">

<!-- 特效層 -->
<div id="lightning"></div>
<div id="lightning-secondary"></div>
<svg id="lightning-svg"></svg>
<div id="rain-layer"></div>
<div id="snow-layer"></div>
<div id="heat-layer"></div>
<div id="wind-layer"></div>
<div id="vortex-bg-layer"></div>

<!-- 主容器 -->
<div class="main-container">
    <div class="content-wrapper">
        <!-- 左側：時間 -->
        <div class="left-panel">
            <div id="clock" class="clock">--:--</div>
            <div id="date" class="date">----/--/--</div>
        </div>
        
        <!-- 右側：天氣 -->
        <div class="right-panel">
            <div class="icon-container">
                <img id="weatherIcon" class="icon" src="" alt="Weather">
                <div id="vortexIconContainer">
                    <svg class="vortex-svg" viewBox="0 0 100 100">
                        <defs>
                            <linearGradient id="vortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:rgba(255,255,255,0.8);stop-opacity:1" />
                                <stop offset="100%" style="stop-color:rgba(255,255,255,0.1);stop-opacity:0" />
                            </linearGradient>
                        </defs>
                        <path d="M50 10 A40 40 0 0 1 90 50 A40 40 0 0 1 50 90 A40 40 0 0 1 10 50 A40 40 0 0 1 50 10" fill="none" stroke="url(#vortexGrad)" stroke-width="4" stroke-dasharray="20 10" />
                        <path d="M50 20 A30 30 0 0 1 80 50 A30 30 0 0 1 50 80 A30 30 0 0 1 20 50 A30 30 0 0 1 50 20" fill="none" stroke="url(#vortexGrad)" stroke-width="6" stroke-dasharray="15 5" />
                        <path d="M50 30 A20 20 0 0 1 70 50 A20 20 0 0 1 50 70 A20 20 0 0 1 30 50 A20 20 0 0 1 50 30" fill="none" stroke="url(#vortexGrad)" stroke-width="8" />
                    </svg>
                    <div id="vortexNumber" class="vortex-number"></div>
                </div>
            </div>
            <div id="message" class="message">Loading...</div>
            <div id="detail" class="detail"></div>
        </div>
    </div>
</div>

<!-- SWT 訊息區 -->
<div class="swt-section">
    <div class="swt-label">Special Weather Tips (SWT)</div>
    <div id="swtContent">暫無特殊天氣提示</div>
</div>

<!-- 模式指示 -->
<div id="modeIndicator" class="mode-indicator">Normal</div>

<!-- 控制按鈕 -->
<button id="toggleBtn" onclick="togglePanel()">...</button>

<!-- 控制面板 -->
<div id="controlPanel">
    <div class="panel-label">語言 / Language</div>
    <div class="button-row">
        <button onclick="setLanguage('tc')">中文</button>
        <button onclick="setLanguage('en')">English</button>
    </div>

    <hr class="panel-divider">

    <div class="panel-label">字體大小 / Font Size</div>
    <div class="button-row">
        <button class="size-btn active" onclick="setFontSize('auto')">自動</button>
        <button class="size-btn" onclick="setFontSize('small')">小</button>
        <button class="size-btn" onclick="setFontSize('medium')">中</button>
        <button class="size-btn" onclick="setFontSize('large')">大</button>
    </div>

    <hr class="panel-divider">

    <div class="panel-label">模式 / Mode</div>
    <div class="button-row">
        <button onclick="switchToNormalMode()">Normal</button>
        <button onclick="switchToSimulationMode()">Simulation</button>
    </div>

    <hr class="panel-divider">

    <div id="simulationControls" style="display:none;">
        <div class="panel-label">颱風信號 / Typhoon (單選)</div>
        <div class="button-row">
            <button id="btn-t1" onclick="toggleWarning('typhoon', 'T1')">T1</button>
            <button id="btn-t3" onclick="toggleWarning('typhoon', 'T3')">T3</button>
            <button id="btn-t8" onclick="toggleWarning('typhoon', 'T8')">T8</button>
            <button id="btn-t10" onclick="toggleWarning('typhoon', 'T10')">T10</button>
        </div>

        <hr class="panel-divider">

        <div class="panel-label">暴雨警告 / Rainstorm (單選)</div>
        <div class="button-row">
            <button id="btn-amber" onclick="toggleWarning('rainstorm', 'AMBER')">Amber</button>
            <button id="btn-red" onclick="toggleWarning('rainstorm', 'RED')">Red</button>
            <button id="btn-black" onclick="toggleWarning('rainstorm', 'BLACK')">Black</button>
        </div>

        <hr class="panel-divider">

        <div class="panel-label">特殊天氣 / Special (多選)</div>
        <div class="button-row">
            <button id="btn-thunder" onclick="toggleWarning('special', 'THUNDER')">Thunderstorm</button>
            <button id="btn-hot" onclick="toggleWarning('special', 'HOT')">Hot</button>
            <button id="btn-cold" onclick="toggleWarning('special', 'COLD')">Cold</button>
        </div>

        <hr class="panel-divider">

        <div class="input-section">
            <label>修改 SWT 訊息 / Edit SWT Message</label>
            <input id="swtInput" type="text" placeholder="輸入特殊天氣提示...">
            <button onclick="updateSWTMessage()">更新訊息 / Update</button>
        </div>
    </div>
</div>

<script>

/* ===== 全局狀態 ===== */
let language = "tc";
let isSimulationMode = false;
let fontSizeMode = "auto"; // auto, small, medium, large

/* 天氣數據狀態 */
let weatherState = {
    warnings: [],        // 警告陣列
    swtMessage: "",      // 特殊天氣提示
    temperature: "--",
    humidity: "--",
    icon: ""
};

/* 模擬模式選擇 */
let simulationState = {
    typhoon: null,       // T1, T3, T8, T10
    rainstorm: null,     // AMBER, RED, BLACK
    special: {           // 多選
        THUNDER: false,
        HOT: false,
        COLD: false
    }
};

let lightningInterval = null;

/* ===== 面板控制 ===== */
let panelHideTimer = null;

function togglePanel() {
    const p = document.getElementById("controlPanel");
    if (p.classList.contains("visible")) hidePanel(); else showPanel();
}

function showPanel() {
    document.getElementById("controlPanel").classList.add("visible");
    resetHideTimer();
}

function hidePanel() {
    document.getElementById("controlPanel").classList.remove("visible");
    clearTimeout(panelHideTimer);
}

function resetHideTimer() {
    clearTimeout(panelHideTimer);
    panelHideTimer = setTimeout(hidePanel, 5000);
}

document.getElementById("controlPanel").addEventListener("mousemove", resetHideTimer);
document.getElementById("controlPanel").addEventListener("touchstart", resetHideTimer);

/* ===== 字體大小控制 ===== */
function setFontSize(mode) {
    fontSizeMode = mode;
    const clock = document.getElementById("clock");
    const date = document.getElementById("date");
    
    clock.classList.remove("size-small", "size-medium", "size-large");
    
    if (mode !== "auto") {
        clock.classList.add("size-" + mode);
    }
    
    document.querySelectorAll(".size-btn").forEach(btn => btn.classList.remove("active"));
    event.target.classList.add("active");
    
    resetHideTimer();
}

/* ===== 時鐘 ===== */
function updateClock() {
    const now = new Date();
    const timeString = now.toLocaleTimeString(language === "en" ? "en-GB" : "zh-HK", { hour: "2-digit", minute: "2-digit" });
    const dateString = language === "en" ? now.toLocaleDateString("en-HK", { year: "numeric", month: "short", day: "numeric" }) : now.toLocaleDateString("zh-HK");
    document.getElementById("clock").innerHTML = timeString;
    document.getElementById("date").innerHTML = dateString;
}

/* ===== 主題 ===== */
function applyTheme(theme) {
    document.body.className = theme;
    if (theme === "typhoon" && weatherState.warnings.some(w => w.includes("10"))) {
        document.body.classList.add("t10-shake");
    }
}

/* ===== 特效清除 ===== */
function clearAllEffects() {
    document.getElementById("rain-layer").innerHTML = "";
    document.getElementById("snow-layer").innerHTML = "";
    document.getElementById("heat-layer").innerHTML = "";
    document.getElementById("wind-layer").innerHTML = "";
    document.getElementById("vortex-bg-layer").innerHTML = "";
    document.getElementById("wind-layer").className = "";
    document.getElementById("lightning-svg").innerHTML = "";
    if (lightningInterval) clearInterval(lightningInterval);
}

/* ===== 雨滴 ===== */
function createRain() {
    const l = document.getElementById("rain-layer");
    for (let i = 0; i < 120; i++) {
        const d = document.createElement("div");
        d.className = "raindrop";
        d.style.left = Math.random() * 100 + "vw";
        d.style.animationDuration = (0.4 + Math.random()) + "s";
        d.style.animationDelay = Math.random() * 2 + "s";
        l.appendChild(d);
    }
}

/* ===== 雪花 ===== */
function createSnow() {
    const l = document.getElementById("snow-layer");
    const chars = ["❄", "❅", "❆"];
    for (let i = 0; i < 60; i++) {
        const f = document.createElement("div");
        f.className = "snowflake";
        f.textContent = chars[Math.floor(Math.random() * chars.length)];
        f.style.left = Math.random() * 100 + "vw";
        f.style.fontSize = (0.7 + Math.random() * 1.5) + "rem";
        f.style.animationDuration = (4 + Math.random() * 6) + "s";
        l.appendChild(f);
    }
}

/* ===== 熱浪 ===== */
function createHeat() {
    const l = document.getElementById("heat-layer");
    for (let i = 0; i < 12; i++) {
        const w = document.createElement("div");
        w.className = "heatwave";
        w.style.left = (Math.random() * 110 - 5) + "vw";
        w.style.width = (100 + Math.random() * 200) + "px";
        w.style.height = w.style.width;
        w.style.animationDuration = (5 + Math.random() * 6) + "s";
        l.appendChild(w);
    }
}

/* ===== 風跡與背景氣旋 ===== */
function createWindAndVortex(intensity) {
    const wl = document.getElementById("wind-layer");
    const vbl = document.getElementById("vortex-bg-layer");
    wl.classList.add(intensity === "T10" ? "wind-layer-t10" : "wind-layer-t8");
    const count = intensity === "T10" ? 25 : 15;
    for (let i = 0; i < count; i++) {
        const s = document.createElement("div");
        s.className = "wind-streak";
        s.style.top = Math.random() * 100 + "vh";
        s.style.width = (200 + Math.random() * 400) + "px";
        s.style.animationDuration = (intensity === "T10" ? 2 : 4) + Math.random() * 3 + "s";
        wl.appendChild(s);
    }
    const v = document.createElement("div");
    v.className = "vortex-bg";
    v.style.animationDuration = intensity === "T10" ? "5s" : "8s";
    vbl.appendChild(v);
}

/* ===== SVG 隨機閃電 ===== */
function generateLightningPath() {
    const x1 = Math.random() * window.innerWidth;
    const y1 = 0;
    const x2 = Math.random() * window.innerWidth;
    const y2 = window.innerHeight;
    
    let path = `M ${x1} ${y1}`;
    let currentX = x1;
    let currentY = y1;
    
    const segments = 8 + Math.floor(Math.random() * 5);
    for (let i = 0; i < segments; i++) {
        currentX += (Math.random() - 0.5) * 80;
        currentY += window.innerHeight / segments;
        path += ` L ${currentX} ${currentY}`;
    }
    
    return path;
}

function triggerLightning() {
    const svg = document.getElementById("lightning-svg");
    svg.innerHTML = "";
    
    for (let i = 0; i < 2; i++) {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", generateLightningPath());
        path.setAttribute("stroke", "rgba(255, 255, 255, 0.8)");
        path.setAttribute("stroke-width", "3");
        path.setAttribute("fill", "none");
        path.setAttribute("stroke-linecap", "round");
        svg.appendChild(path);
    }
    
    const f1 = document.getElementById("lightning");
    const f2 = document.getElementById("lightning-secondary");
    f1.style.opacity = "0.8";
    setTimeout(() => { f1.style.opacity = "0"; }, 100);
    setTimeout(() => {
        f2.style.opacity = "0.6";
        setTimeout(() => { f2.style.opacity = "0"; }, 80);
    }, 150);
}

function startLightning() {
    if (lightningInterval) clearInterval(lightningInterval);
    lightningInterval = setInterval(triggerLightning, 2500 + Math.random() * 2000);
}

/* ===== 警告分類 ===== */
function classifyWarnings(warnings) {
    const res = {
        hasBlack: false,
        hasRed: false,
        hasAmber: false,
        hasThunder: false,
        hasTyphoon: false,
        hasHot: false,
        hasCold: false,
        typhoonSignal: null
    };
    
    for (const w of warnings) {
        const l = w.toLowerCase();
        if (l.includes("black") || w.includes("黑")) res.hasBlack = true;
        if (l.includes("red") || w.includes("紅")) res.hasRed = true;
        if (l.includes("amber") || w.includes("黃")) res.hasAmber = true;
        if (l.includes("thunder") || w.includes("雷暴")) res.hasThunder = true;
        if (l.includes("signal") || w.includes("風球") || w.includes("信號")) {
            res.hasTyphoon = true;
            if (w.includes("10")) res.typhoonSignal = "T10";
            else if (w.includes("8")) res.typhoonSignal = "T8";
            else if (w.includes("3")) res.typhoonSignal = "T3";
            else res.typhoonSignal = "T1";
        }
        if (l.includes("hot") || w.includes("酷熱")) res.hasHot = true;
        if (l.includes("cold") || w.includes("寒冷")) res.hasCold = true;
    }
    
    return res;
}

/* ===== 渲染畫面 ===== */
function renderWeather() {
    const stdIcon = document.getElementById("weatherIcon");
    const vIconCont = document.getElementById("vortexIconContainer");
    const vNum = document.getElementById("vortexNumber");
    const vSvg = vIconCont.querySelector(".vortex-svg");
    
    clearAllEffects();
    
    if (weatherState.warnings.length === 0) {
        applyTheme("normal");
        stdIcon.style.display = "block";
        vIconCont.style.display = "none";
        document.getElementById("message").innerHTML = `${weatherState.temperature}°C`;
        document.getElementById("detail").innerHTML = language === "en" ? `Humidity ${weatherState.humidity}%` : `相對濕度 ${weatherState.humidity}%`;
        return;
    }
    
    const flags = classifyWarnings(weatherState.warnings);
    
    if (flags.hasBlack || flags.hasRed || flags.hasAmber) createRain();
    if (flags.hasHot) createHeat();
    if (flags.hasCold) createSnow();
    if (flags.hasThunder) startLightning();
    
    if (flags.hasTyphoon) {
        stdIcon.style.display = "none";
        vIconCont.style.display = "flex";
        const num = flags.typhoonSignal.replace("T", "");
        vNum.textContent = num;
        vNum.className = "vortex-number" + (num === "10" ? " double-digit" : "");
        vSvg.className = "vortex-svg" + (num === "10" ? " t10" : "");
        createWindAndVortex(flags.typhoonSignal);
    } else {
        stdIcon.style.display = "block";
        vIconCont.style.display = "none";
    }
    
    if (flags.hasBlack) applyTheme(flags.hasThunder ? "blackrain-thunder" : "blackrain");
    else if (flags.hasRed) applyTheme(flags.hasThunder ? "redrain-thunder" : "redrain");
    else if (flags.hasAmber) applyTheme(flags.hasThunder ? "yellowrain-thunder" : "yellowrain");
    else if (flags.hasThunder) applyTheme("thunderstorm");
    else if (flags.hasTyphoon) applyTheme("typhoon");
    else if (flags.hasHot) applyTheme("hot");
    else if (flags.hasCold) applyTheme("cold");
    else applyTheme("normal");
    
    const warningText = weatherState.warnings.join(" / ");
    document.getElementById("message").innerHTML = warningText;
    document.getElementById("detail").innerHTML = weatherState.swtMessage || (language === "en" ? "Weather Warning In Force" : "天氣警告生效中");
}

/* ===== 模式切換 ===== */
function switchToNormalMode() {
    isSimulationMode = false;
    document.getElementById("simulationControls").style.display = "none";
    document.getElementById("modeIndicator").textContent = "Normal";
    document.getElementById("modeIndicator").classList.remove("simulation");
    loadWeatherFromAPI();
    resetHideTimer();
}

function switchToSimulationMode() {
    isSimulationMode = true;
    document.getElementById("simulationControls").style.display = "block";
    document.getElementById("modeIndicator").textContent = "Simulation";
    document.getElementById("modeIndicator").classList.add("simulation");
    updateSimulationState();
    resetHideTimer();
}

/* ===== 模擬控制 ===== */
function toggleWarning(type, value) {
    if (type === "typhoon") {
        simulationState.typhoon = (simulationState.typhoon === value ? null : value);
    } else if (type === "rainstorm") {
        simulationState.rainstorm = (simulationState.rainstorm === value ? null : value);
    } else if (type === "special") {
        simulationState.special[value] = !simulationState.special[value];
    }
    
    updateSimulationState();
    resetHideTimer();
}

function updateSimulationState() {
    const ws = [];
    
    if (simulationState.typhoon) {
        const num = simulationState.typhoon.slice(1);
        ws.push(language === "en" ? `Signal No.${num}` : `${num}號風球`);
    }
    
    if (simulationState.rainstorm) {
        const name = simulationState.rainstorm === "AMBER" ? "黃" : simulationState.rainstorm === "RED" ? "紅" : "黑";
        ws.push(language === "en" ? `${simulationState.rainstorm} Rainstorm` : `${name}色暴雨警告`);
    }
    
    if (simulationState.special.THUNDER) ws.push(language === "en" ? "Thunderstorm Warning" : "雷暴警告");
    if (simulationState.special.HOT) ws.push(language === "en" ? "Hot Weather Warning" : "酷熱天氣警告");
    if (simulationState.special.COLD) ws.push(language === "en" ? "Cold Weather Warning" : "寒冷天氣警告");
    
    weatherState.warnings = ws;
    
    updateButtonStates();
    renderWeather();
}

function updateButtonStates() {
    document.getElementById("btn-t1").className = simulationState.typhoon === "T1" ? "active" : "";
    document.getElementById("btn-t3").className = simulationState.typhoon === "T3" ? "active" : "";
    document.getElementById("btn-t8").className = simulationState.typhoon === "T8" ? "active" : "";
    document.getElementById("btn-t10").className = simulationState.typhoon === "T10" ? "active" : "";
    document.getElementById("btn-amber").className = simulationState.rainstorm === "AMBER" ? "active" : "";
    document.getElementById("btn-red").className = simulationState.rainstorm === "RED" ? "active" : "";
    document.getElementById("btn-black").className = simulationState.rainstorm === "BLACK" ? "active" : "";
    document.getElementById("btn-thunder").className = simulationState.special.THUNDER ? "active" : "";
    document.getElementById("btn-hot").className = simulationState.special.HOT ? "active" : "";
    document.getElementById("btn-cold").className = simulationState.special.COLD ? "active" : "";
}

function updateSWTMessage() {
    const input = document.getElementById("swtInput");
    weatherState.swtMessage = input.value;
    document.getElementById("swtContent").innerHTML = weatherState.swtMessage || "暫無特殊天氣提示";
    renderWeather();
}

/* ===== 語言切換 ===== */
function setLanguage(lang) {
    language = lang;
    updateClock();
    if (isSimulationMode) {
        updateSimulationState();
    } else {
        loadWeatherFromAPI();
    }
}

/* ===== 天文台 API ===== */
async function loadWeatherFromAPI() {
    try {
        const r = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=${language}`);
        const data = await r.json();
        weatherState.temperature = data.temperature.data[1].value;
        weatherState.humidity = data.humidity.data[0].value;
        weatherState.icon = `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${data.icon[0]}.png`;
        document.getElementById("weatherIcon").src = weatherState.icon;
        
        const wr = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=${language}`);
        const wdata = await wr.json();
        weatherState.warnings = [];
        for (const k in wdata) {
            if (wdata[k].actionCode === "ISSUE") {
                weatherState.warnings.push(wdata[k].name);
            }
        }
        
        try {
            const sr = await fetch(`https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=swt&lang=${language}`);
            const sdata = await sr.json();
            if (Array.isArray(sdata) && sdata.length > 0) {
                weatherState.swtMessage = sdata[0].desc || "";
            }
        } catch(e) {}
        
        document.getElementById("swtContent").innerHTML = weatherState.swtMessage || (language === "en" ? "No special weather tips" : "暫無特殊天氣提示");
        renderWeather();
    } catch(e) {
        console.error(e);
    }
}

/* ===== 初始化 ===== */
updateClock();
loadWeatherFromAPI();
setInterval(updateClock, 1000);
setInterval(() => { if (!isSimulationMode) loadWeatherFromAPI(); }, 300000);

</script>
